// hub経由(#hub=<token>)で開いたときだけ🏠を出す
if (/hub=/.test(location.hash)) sessionStorage.setItem("secondhand-map-hub-v1", "1");
if (sessionStorage.getItem("secondhand-map-hub-v1")) document.getElementById("home").style.display = "";
const AREAS = { all: "すべて", monnaka: "門前仲町", ofuna: "大船", yugawara: "湯河原" };
let area = "all";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const PARK = { easy: "🅿◎ 停めやすい", ok: "🅿○ 駐車場あり", hard: "🅿△ 停めにくい", none: "🅿✕ 駐車場なし" };
const score = (s) => (s.super_bazaar ? 4 : 0) + (s.large ? 2 : 0) + (s.highlight ? 1 : 0);

function render() {
  const showFashion = $("fashion").checked, pickOnly = $("pick").checked;
  const q = $("q").value.trim().toLowerCase();
  const hit = SHOPS.filter((s) =>
    (area === "all" || s.area === area) &&
    (showFashion || !s.fashion_only) &&
    (!pickOnly || score(s) > 0) &&
    (!$("car").checked || s.parking_ease === "easy" || s.parking_ease === "ok") &&
    (!q || [s.name, s.chain, s.address, s.highlight, (s.categories || []).join(" ")].join(" ").toLowerCase().includes(q)));
  $("count").textContent = `${hit.length}件 / 全${SHOPS.length}件`;
  const groups = Object.keys(AREAS).filter((a) => a !== "all" && (area === "all" || area === a));
  $("list").innerHTML = groups.map((a) => {
    const rows = hit.filter((s) => s.area === a).sort((x, y) => score(y) - score(x));
    if (!rows.length) return "";
    return `<h2>${AREAS[a]}(${rows.length})</h2>` + rows.map((s) => `
      <div class="card ${s.super_bazaar ? "sb" : s.large ? "lg" : ""} ${s.fashion_only ? "fa" : ""}">
        <div class="name">${esc(s.name)}
          ${s.super_bazaar ? '<span class="badge b-sb">SUPER BAZAAR</span>' : ""}
          ${s.large ? '<span class="badge b-lg">大型</span>' : ""}
          ${s.fashion_only ? '<span class="badge b-fa">ファッション専門</span>' : ""}
          ${s.confidence === "low" ? '<span class="badge b-low">要確認</span>' : ""}
        </div>
        <div class="meta">${esc((s.categories || []).join("・"))}${s.size ? " / " + esc(s.size) : ""}</div>
        ${s.highlight ? `<div class="hl">${esc(s.highlight)}</div>` : ""}
        ${s.parking_ease || s.parking_note ? `<div class="meta">${s.parking_ease ? `<span class="badge b-p-${s.parking_ease}" style="margin-left:0">${PARK[s.parking_ease]}</span> ` : "🅿 "}${esc(s.parking_note)}</div>` : ""}
        <div class="meta">${esc(s.nearest)} ・ ${esc(s.hours)}</div>
        <div class="meta"><a href="https://www.google.com/maps/search/${encodeURIComponent(s.name + " " + s.address)}" target="_blank">地図</a>
          ${s.source ? ` ・ <a href="${esc(s.source)}" target="_blank">出典</a>` : ""} ・ ${esc(s.address)}</div>
      </div>`).join("");
  }).join("") || "<p>該当なし</p>";
}

$("tabs").innerHTML = Object.entries(AREAS).map(([k, v]) => `<button class="tab ${k === area ? "on" : ""}" data-a="${k}">${v}</button>`).join("");
$("tabs").onclick = (e) => {
  const a = e.target.dataset.a; if (!a) return;
  area = a;
  document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("on", b.dataset.a === a));
  render();
};
["fashion", "pick", "car", "q"].forEach((id) => $(id).addEventListener("input", render));
render();
</script>
